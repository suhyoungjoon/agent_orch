services:
  # ── FastAPI 백엔드 ──────────────────────────────────────────────────
  - type: web
    name: agentflow-backend
    runtime: python
    rootDir: backend
    autoDeploy: true
    buildCommand: pip install --no-cache-dir --prefer-binary -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: DATABASE_URL
        fromDatabase:
          name: agentflow-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://agent-orch.vercel.app
      - key: APP_ENV
        value: production

  # ── PostgreSQL (Render 무료 DB) ─────────────────────────────────────
databases:
  - name: agentflow-db
    databaseName: agentflow
    user: agentflow
    plan: free
